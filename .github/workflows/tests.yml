# Run the model and Home Assistant integration tests on every push and pull
# request, against the latest Home Assistant test harness.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the Home Assistant test harness
        run: pip install pytest-homeassistant-custom-component

      - name: Run tests
        run: python -m pytest -q
